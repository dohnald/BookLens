<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>BookLens</title>
  <style>
    body {
      width: 320px;
      padding: 15px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      background-color: #f9f9f9;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 15px 0;
      color: #333;
      text-align: center;
    }
    
    /* Tabs */
    .tabs {
      display: flex;
      border-bottom: 2px solid #ddd;
      margin-bottom: 15px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: #666;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: all 0.2s;
    }
    .tab-btn:hover {
      color: #333;
      background-color: #eee;
    }
    .tab-btn.active {
      color: #e74c3c;
      border-bottom: 2px solid #e74c3c;
    }

    /* Input Area */
    .input-group {
      display: flex;
      gap: 5px;
      margin-bottom: 15px;
    }
    input[type="text"] {
      flex: 1;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
    }
    button#add-btn {
      padding: 8px 12px;
      background-color: #e74c3c;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    button#add-btn:hover {
      background-color: #c0392b;
    }

    /* List Area */
    .list-container {
      max-height: 300px;
      overflow-y: auto;
      background: white;
      border: 1px solid #eee;
      border-radius: 4px;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.05);
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      border-bottom: 1px solid #f0f0f0;
      font-size: 13px;
    }
    li:last-child {
      border-bottom: none;
    }
    li:hover {
      background-color: #fafafa;
    }
    .remove-btn {
      background: none;
      border: none;
      color: #999;
      cursor: pointer;
      font-size: 16px;
      padding: 0 5px;
    }
    .remove-btn:hover {
      color: #e74c3c;
    }
    
    .empty-state {
      padding: 20px;
      text-align: center;
      color: #999;
      font-size: 13px;
    }

    /* Footer Stats */
    .stats {
      margin-top: 15px;
      font-size: 12px;
      color: #888;
      text-align: right;
      border-top: 1px solid #eee;
      padding-top: 10px;
    }
  </style>
</head>
<body>
  <h1>BookLens Settings</h1>
  
  <div class="tabs">
    <button id="tab-publishers" class="tab-btn active" data-tab="publishers">Publishers</button>
    <button id="tab-authors" class="tab-btn" data-tab="authors">Authors</button>
  </div>

  <div class="input-group">
    <input type="text" id="new-item-input" placeholder="Enter name to block...">
    <button id="add-btn">Add</button>
  </div>

  <div class="list-container">
    <ul id="block-list">
      <!-- Items will be injected here -->
    </ul>
    <div id="empty-msg" class="empty-state" style="display: none;">
      No items blocked yet.
    </div>
  </div>

  <div class="stats">
    Total Blocked: <span id="total-count">0</span>
  </div>

  <script src="../scripts/utils.js"></script>
  <script src="popup.js"></script>
</body>
</html>
